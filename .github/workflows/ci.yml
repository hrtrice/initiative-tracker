name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config tests/e2e/playwright.config.ts
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Docker image builds
        run: docker build -t initiative-tracker .
      # Previews what .railway/railway.ts would change on the live service and fails
      # if Railway rejects it. Skipped when the token isn't available (e.g. fork PRs).
      - name: Check for Railway token
        id: railway
        run: echo "available=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Preview Railway config changes
        if: steps.railway.outputs.available == 'true'
        run: npx --yes @railway/cli@5 config plan --verbose
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      # Prints the project, environment and services the token can see (no secrets),
      # so a "Service not found" failure shows what RAILWAY_SERVICE must match.
      - name: Show Railway target
        run: npx --yes @railway/cli@5 status || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .railway/railway.ts imports the railway SDK.
      - run: npm ci
      # Without --confirm-destructive, a change that would delete anything fails the
      # deploy instead of happening silently.
      - name: Apply Railway config
        run: npx --yes @railway/cli@5 config apply --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy to Railway
        run: npx --yes @railway/cli@5 up --ci --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
